apiVersion: batch/v1
kind: Job
metadata:
  name: classifier-batch-lane4c-review
  namespace: job-radar-coach
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: classifier
          image: job-radar-classifier:dev
          imagePullPolicy: Never
          command: ["python", "-m", "classifier.job"]
          args:
            - --limit
            - "1"
            - --timeout-seconds
            - "120"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-db
                  key: DATABASE_URL
            - name: OLLAMA_BASE_URL
              value: http://host.docker.internal:11434
            - name: CODEX_HOME
              value: /run/secrets/codex
          volumeMounts:
            - name: codex-auth
              mountPath: /run/secrets/codex
              readOnly: true
      volumes:
        - name: codex-auth
          secret:
            secretName: batch-codex-auth
            optional: true
