apiVersion: batch/v1
kind: CronJob
metadata:
  name: scraper
  namespace: job-radar-coach
spec:
  schedule: "30 0,6,12,18 * * *" # every 6:30 and 12:30 of the day (4 times, AM+PM)
  timeZone: Asia/Jerusalem
  suspend: true # Scheduling stays paused; validate with manual Jobs.
  concurrencyPolicy: Forbid
  jobTemplate: # layer 2: the Job
    spec:
      ttlSecondsAfterFinished: 3600
      activeDeadlineSeconds: 900
      backoffLimit: 0
      template: # layer 3: the Pod
        spec:
          restartPolicy: Never # a job runs once; don't loop on failure
          containers:
            - name: scraper
              image: job-radar:dev
              args:
                - --max-pages
                - "1"
                - --jd-fetch-cap
                - "40"
                - --no-annotate
                - --sources
                - comeet,greenhouse,lever,workable
                - --profile
                - /run/secrets/job-radar/profile.yaml
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: # pull it from the Secret you made
                      name: supabase-db
                      key: DATABASE_URL
              volumeMounts:
                - name: scraper-profile
                  mountPath: /run/secrets/job-radar
                  readOnly: true
          volumes:
            - name: scraper-profile
              secret:
                secretName: scraper-profile
