# Dedicated disposable stack; never link this project to a hosted database.
project_id = "jrc-p12-test-db"
[api]
enabled = true
port = 55431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[api.tls]
enabled = true
cert_path = "./cert.pem"
key_path = "./key.pem"
[db]
port = 55432
shadow_port = 55430
major_version = 17
[db.seed]
enabled = false
sql_paths = []
[studio]
enabled = false
[local_smtp]
enabled = true
port = 55434
[auth]
enabled = true
site_url = "https://127.0.0.1:4343"
additional_redirect_urls = ["https://127.0.0.1:4343/auth/callback"]
enable_signup = false
[auth.email]
enable_signup = true
enable_confirmations = false
[analytics]
enabled = false
