name: ATS discovery validation
on:
  pull_request:
    paths:
      - "scraper/**"
      - "scripts/check_private_files.py"
      - ".github/workflows/ats-discovery-*.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ats-discovery-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out dispatched ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "psycopg[binary]==3.3.5" "jsonschema==4.26.0" "pytest==9.0.2" "ruff==0.15.15"
      - name: Verify generated data and discovery contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/check_private_files.py --all-tracked
          python -m ruff check scraper/ats_discovery.py scraper/ats_discovery_changes.py scraper/source_registry.py scraper/sources
          python -m pytest scraper/test_ats_discovery.py scraper/test_ats_discovery_changes.py scraper/test_sources.py -q
          python - <<'PY'
          from scraper.source_registry import load_registry
          report = load_registry()
          if report.invalid:
              raise SystemExit(f"Registry has {len(report.invalid)} invalid entries")
          PY
