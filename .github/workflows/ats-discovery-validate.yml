name: ATS discovery validation
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out dispatched ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "psycopg[binary]==3.3.5" "jsonschema==4.26.0" "pytest==9.0.2" "ruff==0.15.15"
      - name: Verify generated data and scraper
        run: |
          python scripts/check_private_files.py --all-tracked
          python -m ruff check scraper
          python -m pytest scraper -q
          python - <<'PY'
          from scraper.source_registry import load_registry
          report = load_registry()
          if report.invalid:
              raise SystemExit(f"Registry has {len(report.invalid)} invalid entries")
          PY
