name: Cloud scrape
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install "psycopg[binary]==3.3.5" "jsonschema==4.26.0"
      - name: Fetch and persist public postings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          python -m scraper.cloud_run --receipt cloud-scrape-receipt.json \
            2>&1 | tee cloud-scrape.log
      - name: Write run summary
        if: always()
        run: |
          if [[ -f cloud-scrape-receipt.json ]]; then
            {
              echo "## Cloud scrape"
              jq -r '"- Status: `\(.status)`\n- Exit code: `\(.exit_code)`\n- Sources: `\(.sources | join(", "))`\n- Network requests skipped: `\(.network_request_skips)`"' cloud-scrape-receipt.json
              echo "- Commit: \`${GITHUB_SHA}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "## Cloud scrape"
              echo "- Status: \`failure\`"
              echo "- Error: \`receipt_missing\`"
              echo "- Commit: \`${GITHUB_SHA}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-scrape-${{ github.run_id }}
          path: |
            cloud-scrape.log
            cloud-scrape-receipt.json
          if-no-files-found: warn
          retention-days: 7
