name: ATS liveness
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ats-liveness
  cancel-in-progress: false
jobs:
  recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "psycopg[binary]==3.3.5"
      - name: Recheck every stored ATS tenant
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scraper.recheck --scope ats --jitter --receipt ats-liveness-receipt.json
      - name: Surface uncertain checks
        if: always()
        run: |
          if [[ -f ats-liveness-receipt.json ]]; then
            cat ats-liveness-receipt.json >> "$GITHUB_STEP_SUMMARY"
          fi
          python -m scraper.run_alerts --kind liveness --receipt ats-liveness-receipt.json
      - name: Preserve receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ats-liveness-${{ github.run_id }}
          path: ats-liveness-receipt.json
          if-no-files-found: warn
          retention-days: 7
