version = 1

test_patterns = ["scraper/test_*.py", "extractor/test_*.py", "classifier/test_*.py"]
exclude_patterns = ["scraper/fixtures/**"]

[[analyzers]]
name = "python"
enabled = true

[analyzers.meta]
runtime_version = "3.x.x"

[[analyzers]]
name = "docker"
enabled = true

[analyzers.meta]
dockerfile_paths = ["scraper/Dockerfile"]
