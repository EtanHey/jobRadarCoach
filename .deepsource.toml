version = 1

test_patterns = ["scraper/test_*.py", "extractor/test_*.py", "classifier/test_*.py", "test_support/**"]
exclude_patterns = ["scraper/fixtures/**"]

[[analyzers]]
name = "python"
enabled = true

[analyzers.meta]
runtime_version = "3.x.x"

[[analyzers]]
name = "docker"
enabled = true

[analyzers.meta]
dockerfile_paths = ["scraper/Dockerfile", "ui/Dockerfile"]

[[analyzers]]
name = "javascript"
enabled = true

[analyzers.meta]
plugins = ["react"]
environment = ["nodejs", "browser"]
dependency_file_paths = ["ui"]
